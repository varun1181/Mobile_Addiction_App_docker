base:
  random_state: 42
  target: Addiction_Level

data_ingestion:
  raw_path: data/raw/phone_addiction_dataset.csv
  test_size: 0.2

data_preprocessing:
  drop_columns: [Name, Location]            # identifiers, no predictive meaning
  rename_columns:
    Interllectual_Performance: Intellectual_Performance   # fix the typo in the raw header

feature_engineering:
  epsilon: 1.0e-5
  ratio_features:                            # new_column: [numerator, denominator]
    Social_Media_Ratio: [Time_on_Social_Media, Daily_Usage_Hours]
    Gaming_Ratio: [Time_on_Gaming, Daily_Usage_Hours]
    Education_Ratio: [Time_on_Education, Daily_Usage_Hours]

model_building:
  n_trials: 20
  cv_folds: 3
  n_jobs: -1
  onehot_columns: [Gender, Phone_Usage_Purpose]

model_evaluation:
  mlflow_tracking_uri: sqlite:///mlflow.db
  experiment_name: Mobile_Addiction_Prediction
